<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Stationery Store</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Login Card */
    .login-container {
      background: #ffffff;
      padding: 40px;
      width: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-radius: 12px;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c3e50;
      font-size: 28px;
    }

    .login-container p {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: 0.3s;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #3498db;
      box-shadow: 0 0 5px rgba(52,152,219,0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #3498db;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    /* ✅ Google Button Style */
    #googleLoginBtn {
      margin-top: 12px;
      background: #db4437;
    }

    #googleLoginBtn:hover {
      background: #c23321;
    }

    #loginMsg {
      margin-top: 12px;
      text-align: center;
      color: red;
      font-weight: 500;
    }

    #googleMsg {
      margin-top: 12px;
      text-align: center;
      color: green;
      font-weight: 500;
    }

    .links {
      text-align: center;
      margin-top: 15px;
    }

    .links a {
      text-decoration: none;
      color: #3498db;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h1>Welcome Back</h1>
    <p>Login to continue shopping</p>

    <form id="loginForm">

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit">Login</button>
      <div id="loginMsg"></div>
    </form>

    <!-- ✅ GOOGLE SIGN-IN BUTTON (ADDED) -->
    <button type="button" id="googleLoginBtn">Sign in with Google</button>
    <div id="googleMsg"></div>

    <div class="links">
      <p>Don't have an account? <a href="register.html">Register</a></p>
      <a href="index.html">← Back to Home</a>
    </div>

    <div class="links">
      <p>Forgot password? <a href="forgot.html">Reset Here</a></p>
    </div>

  </div>

  <!-- ================= EXISTING USERNAME LOGIN SCRIPT ================= -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      try{
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        });
        const data = await res.json();
        if(res.ok){
          window.location.href = 'products.html';
        } else {
          document.getElementById('loginMsg').textContent = data.message || 'Login failed';
        }
      }catch(err){ console.error(err); }
    });
  </script>

  <!-- ================= GOOGLE LOGIN SCRIPT (ADDED WITHOUT DISTURBING) ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxas_UoXLbn0tu6NvQNRQoBj9FWFT4-uI",
      authDomain: "stationery-website-c7cee.firebaseapp.com",
      projectId: "stationery-website-c7cee",
      storageBucket: "stationery-website-c7cee.appspot.com",
      messagingSenderId: "553718261048",
      appId: "1:553718261048:web:cd2cc5804e5c649fe8cdcd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const googleBtn = document.getElementById("googleLoginBtn");
    const googleMsg = document.getElementById("googleMsg");

    if (googleBtn) {
      googleBtn.addEventListener("click", async () => {
        try {
          googleMsg.innerText = "";

          const provider = new GoogleAuthProvider();
          const result = await signInWithPopup(auth, provider);

          // create backend session
          const res = await fetch("/api/firebase-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email: result.user.email })
          });

          const data = await res.json();

          if (res.ok) {
            googleMsg.innerText = "Google Login Successful! Redirecting...";
            setTimeout(() => {
              window.location.href = "products.html";
            }, 1200);
          } else {
            googleMsg.innerText = "Backend login failed: " + data.message;
          }

        } catch (err) {
          console.error(err);
          googleMsg.innerText = "Google login failed: " + err.code;
        }
      });
    }
  </script>

</body>
</html>
